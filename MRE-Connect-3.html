<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MRE Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
/* Concept: premium dark + gold, one scrolling page per menu entry, a draggable 3D globe as the hero, gold buttons that breathe slowly like LEDs */
:root{
  --bg:#070b17; --bg2:#0d1428; --surf:#121b33; --surf2:#1a274b; --glass:rgba(18,27,51,.72);
  --gold:#d4af37; --gold2:#f3d775; --goldDim:rgba(212,175,55,.18); --red:#c41e3a; --green:#006233; --green2:#0f9d58; --blue:#1f5fbf;
  --ink:#eef2ff; --dim:#9aa3c2; --line:rgba(212,175,55,.2); --line2:rgba(212,175,55,.42); --danger:#ff7a7a;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;min-height:100vh;
  background:radial-gradient(ellipse at 20% -10%,rgba(212,175,55,.13),transparent 50%),radial-gradient(ellipse at 90% 30%,rgba(196,30,58,.12),transparent 45%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px,rgba(212,175,55,.1) 1px,transparent 0),linear-gradient(45deg,rgba(212,175,55,.035) 25%,transparent 0,transparent 75%,rgba(212,175,55,.035) 0),linear-gradient(-45deg,rgba(212,175,55,.035) 25%,transparent 0,transparent 75%,rgba(212,175,55,.035) 0);
  background-size:28px 28px,56px 56px,56px 56px}
h1,h2,h3,.serif{font-family:var(--serif);text-wrap:balance}
button{font-family:inherit;cursor:pointer}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto}
/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;background:var(--bg);border-bottom:1px solid rgba(212,175,55,.14)}
.logo{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;color:var(--ink);text-align:start}
.logo i{flex:none;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--green));display:grid;place-items:center;font:800 11px var(--sans);letter-spacing:.12em;font-style:normal}
.logo b{font:700 11px var(--sans);letter-spacing:.2em;color:var(--gold2);line-height:1.3}
.logo b span{display:block;color:var(--dim);font-weight:500;letter-spacing:.08em;font-size:10px}
.sel{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.5rem .8rem;font:600 .8rem var(--sans)}
.sel option{background:var(--surf)}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--gold2);border-radius:999px;padding:.45rem .9rem;font:700 .8rem var(--sans);margin-bottom:14px}
/* boutons : lueur dorée qui respire */
.cta{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:.95rem 1.6rem;background:var(--gold);color:#0b0f1d;font:800 .95rem var(--sans);letter-spacing:.02em;text-decoration:none;animation:breathe 3.4s ease-in-out infinite alternate}
.cta:active{transform:scale(.98)}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:.9rem 1.4rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--ink);font:700 .92rem var(--sans);text-decoration:none;animation:breatheSoft 4.2s ease-in-out infinite alternate}
.danger{border-color:rgba(255,122,122,.5);color:var(--danger)}
@keyframes breathe{from{box-shadow:0 0 6px rgba(212,175,55,.18),0 6px 18px rgba(212,175,55,.12);filter:brightness(.88)}to{box-shadow:0 0 22px rgba(243,215,117,.65),0 10px 34px rgba(212,175,55,.42);filter:brightness(1.08)}}
@keyframes breatheSoft{from{box-shadow:0 0 0 rgba(212,175,55,0);border-color:rgba(255,255,255,.14)}to{box-shadow:0 0 16px rgba(212,175,55,.28);border-color:var(--line2)}}
@keyframes led{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view>*{animation:rise .35s ease both}
/* accueil */
.hero{position:relative;padding-block:18px 8px;display:flex;flex-direction:column;gap:18px}
.leds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leds s{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold);animation:led 4s ease-in-out infinite}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.4rem .9rem;font:700 .68rem var(--sans);letter-spacing:.18em;color:var(--gold2)}
.pill s{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:led 2.6s ease-in-out infinite}
.h1{overflow-wrap:anywhere;font:700 clamp(2.1rem,9.5vw,4.2rem)/1 var(--serif);letter-spacing:-.02em}
.h1 em{display:block;font-style:normal;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--dim);font-size:1.08rem;max-width:36ch}
.row{display:flex;gap:12px;flex-wrap:wrap}
.vals{display:flex;gap:8px;flex-wrap:wrap}
.vals span{border:1px solid var(--line);border-radius:999px;padding:.28rem .8rem;font:700 .62rem var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(212,175,55,.08),0 20px 60px rgba(0,0,0,.5)}
.globeCard{padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flag{display:flex;align-items:center;gap:10px;font:700 .72rem var(--sans);letter-spacing:.14em}
.flag i{width:46px;height:32px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:var(--green2);font-style:normal;font-size:20px;border:1px solid rgba(255,255,255,.12)}
.flag small{display:block;color:var(--dim);font-weight:500;letter-spacing:.05em;font-size:.7rem}
.live{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:#6ee7b7;border-radius:999px;padding:.25rem .7rem;font:800 .62rem var(--sans);letter-spacing:.1em}
.live s{width:6px;height:6px;border-radius:50%;background:#34d399;animation:led 2s infinite}
#globeHost{position:relative;width:100%;aspect-ratio:1/1;max-height:520px;border-radius:22px;background:radial-gradient(circle at 50% 45%,#13204a 0%,#0a1026 62%,#070b17 100%);border:1px solid rgba(255,255,255,.08);overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#globe:active{cursor:grabbing}
.ghint{text-align:center;font-size:.75rem;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font:700 1.7rem/1 var(--serif);color:var(--gold2)}
.stat span{font:700 .6rem var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.band{text-align:center;padding:26px 8px;display:flex;flex-direction:column;gap:6px}
.band h2{font:700 clamp(1.7rem,7vw,2.6rem)/1.05 var(--serif);color:var(--gold2)}
.band p{color:var(--dim)}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh h2{font:700 clamp(1.7rem,7vw,2.4rem)/1 var(--serif)}
.sh p{color:var(--dim);font-size:.85rem}
.more{background:none;border:0;color:var(--gold2);font:700 .85rem var(--sans)}
.poles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.poles{grid-template-columns:repeat(4,1fr)}}
.pole{display:flex;flex-direction:column;gap:10px;text-align:start;padding:14px;border-radius:18px;background:var(--surf);border:1px solid var(--line);color:var(--ink);min-width:0;transition:border-color .25s,box-shadow .25s,transform .1s}
.pole:hover{border-color:var(--line2);box-shadow:0 0 22px rgba(212,175,55,.18)}
.pole:active{transform:scale(.98)}
.pole .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--goldDim);border:1px solid var(--line);animation:breatheSoft 4s ease-in-out infinite alternate}
.pole b{font:700 .82rem/1.25 var(--sans);overflow-wrap:anywhere}
.pole span{margin-top:auto;font-size:.7rem;color:var(--dim)}
.ico svg,.nav svg{display:block}
.promo{position:relative;overflow:hidden;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.promo h2{font:700 clamp(1.8rem,8vw,2.8rem)/.98 var(--serif)}
.promo h2 em{font-style:normal;color:var(--gold2)}
.promo p{color:var(--dim);max-width:52ch}
/* annuaire */
.tools{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.tools{grid-template-columns:1.6fr 1fr 1fr 1fr}}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:.8rem 1rem;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:rgba(238,242,255,.32)}
select option{background:var(--surf)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--line2);background:rgba(255,255,255,.09)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
textarea{min-height:84px;resize:vertical}
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;padding:.45rem .9rem;font:600 .8rem var(--sans)}
.chip b{color:var(--gold2);margin-left:.4rem}
.chip[aria-pressed="true"]{background:var(--gold);color:#0b0f1d;border-color:var(--gold)}
.chip[aria-pressed="true"] b{color:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mem{display:flex;flex-direction:column;gap:9px;text-align:start;padding:16px;border-radius:20px;background:var(--surf);border:1px solid var(--line);color:var(--ink);min-width:0;transition:border-color .25s,box-shadow .25s}
.mem:hover{border-color:var(--line2);box-shadow:0 0 24px rgba(212,175,55,.16)}
.mt{display:flex;gap:12px;align-items:center;min-width:0}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2a3a6a,var(--surf2));border:1px solid var(--line);display:grid;place-items:center;font:700 1.05rem var(--serif);color:var(--gold2)}
.av.big{width:74px;height:74px;font-size:1.7rem}
.nm{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.loc{font-size:.78rem;color:var(--dim)}
.tag{align-self:flex-start;border:1px solid rgba(212,175,55,.3);background:rgba(212,175,55,.12);color:var(--gold2);border-radius:999px;padding:.2rem .65rem;font:700 .68rem var(--sans)}
.sk{font-size:.83rem;color:rgba(238,242,255,.72);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.open{margin-top:auto;font:700 .75rem var(--sans);color:var(--gold2)}
.empty{border:1px dashed rgba(255,255,255,.18);border-radius:22px;padding:34px 20px;text-align:center;color:var(--dim);grid-column:1/-1}
.empty strong{display:block;font:700 1.5rem var(--serif);color:var(--ink);margin-bottom:6px}
.empty .cta{margin-top:14px}
/* fiche */
.fiche{padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.fh{display:flex;gap:16px;align-items:center}
.fh h2{font:700 1.9rem/1.05 var(--serif);overflow-wrap:anywhere}
.blk{border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.blk small{display:block;font:700 .64rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.blk p{overflow-wrap:anywhere;white-space:pre-wrap}
.ct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ct span{min-width:0;overflow-wrap:anywhere;user-select:all}
.mini{border:1px solid var(--line);background:transparent;color:var(--gold2);border-radius:10px;padding:.25rem .65rem;font:700 .72rem var(--sans)}
/* sondage */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-align:start;border:0;border-radius:18px;padding:14px 16px;color:#fff;font:700 1rem/1.25 var(--sans);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.opt .l{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 1.2rem var(--sans)}
.opt .t{position:relative;flex:1;min-width:0}
.opt .p{position:relative;font:800 .95rem var(--sans);flex:none}
.opt .bar{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,255,255,.2);transition:width .7s ease}
.opt[aria-pressed="true"]{outline:3px solid var(--gold2);outline-offset:2px}
.oA{background:linear-gradient(180deg,#d8243f,#a5162d)}.oA .l{color:#c41e3a}
.oB{background:linear-gradient(180deg,#14a35f,#0a6b3d)}.oB .l{color:#0a6b3d}
.oC{background:linear-gradient(180deg,#2c74d9,#1a4b9c)}.oC .l{color:#1a4b9c}
.oD{background:linear-gradient(180deg,#e8bd3c,#b98f1c);color:#1a1405}.oD .l{color:#9a7510}
/* énergies */
.etiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.etile{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;font:700 .85rem var(--sans)}
.etile .ico{width:40px;height:40px;border-radius:50%;background:var(--goldDim);color:var(--gold);display:grid;place-items:center;animation:breatheSoft 4s ease-in-out infinite alternate}
.fact{border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.08);border-radius:16px;padding:12px 14px;font-size:.88rem}
/* formulaire */
.panel{padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font:700 1.9rem/1 var(--serif)}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font:700 .66rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--dim)}
.cons input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--gold)}
.note{border:1px solid var(--line);background:rgba(212,175,55,.09);border-radius:14px;padding:.7rem .9rem;font-size:.8rem;color:var(--gold2);margin-bottom:14px}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:22px;display:flex;flex-direction:column;gap:10px}
footer b{font:700 1.3rem var(--serif);color:var(--gold2)}
footer p{font-size:.78rem;color:var(--dim)}
/* navigation basse */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.nav>div{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:22px;background:rgba(13,20,40,.92);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--dim);font:700 .62rem var(--sans);padding:7px 2px;border-radius:16px;min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--gold2);background:var(--goldDim);box-shadow:0 0 14px rgba(212,175,55,.25)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--gold);color:#0b0f1d;padding:.7rem 1.1rem;border-radius:999px;font:800 .85rem var(--sans);transition:.25s;max-width:90vw;text-align:center;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* arabe : lecture de droite à gauche */
:root[lang="ar"]{--sans:'Cairo',system-ui,sans-serif;--serif:'Cairo',system-ui,sans-serif}
[lang="ar"] *{letter-spacing:0!important}
[lang="ar"] .h1{line-height:1.25}
[dir="rtl"] .cta svg,[dir="rtl"] .back svg{transform:scaleX(-1)}
.arr{font-style:normal;display:inline-block}
[dir="rtl"] .arr{transform:scaleX(-1)}
input[type=tel],input[type=email]{direction:ltr}
[dir="rtl"] input[type=tel],[dir="rtl"] input[type=email]{text-align:right}
/* business + café */
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--goldDim);border:1px solid var(--line);animation:breatheSoft 4s ease-in-out infinite alternate}
.bzr{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.bzr p{padding-top:2px}
.bzg{display:grid;gap:12px}
@media (min-width:640px){.bzg{grid-template-columns:1fr 1fr}}
.bz{padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.bz h3{font:700 1.6rem/1.05 var(--serif)}
.bz p{color:var(--dim)}
.coffee{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.disc{font-size:.78rem;color:var(--dim);border:1px dashed rgba(255,255,255,.18);border-radius:14px;padding:.8rem 1rem}
[hidden]{display:none!important}
</style>

<div class="app">
  <div class="top">
    <button class="logo" id="logo" aria-label="MRE Connect"><i>MRE</i><b>MRE CONNECT<span id="logoSub"></span></b></button>
    <select class="sel" id="lang" aria-label="Language"></select>
  </div>
  <main id="view"></main>
  <section id="formView" hidden>
    <button class="back" id="formBack"></button>
    <div id="formNote" class="note" hidden></div>
    <form class="glass panel" id="form" autocomplete="on">
      <h2 id="formTitle"></h2>
      <div class="two">
        <div class="f"><label for="first" id="lFirst"></label><input id="first" autocomplete="given-name" placeholder="Ahmed"></div>
        <div class="f"><label for="last" id="lLast"></label><input id="last" autocomplete="family-name" placeholder="Benali"></div>
      </div>
      <div class="f"><label for="phone" id="lPhone"></label><input id="phone" type="tel" autocomplete="tel" placeholder="+33 6 12 34 56 78"></div>
      <div class="f"><label for="email" id="lEmail"></label><input id="email" type="email" autocomplete="email" placeholder="ahmed@exemple.com"></div>
      <div class="two">
        <div class="f"><label for="country" id="lCountry"></label><select id="country"></select></div>
        <div class="f"><label for="city" id="lCity"></label><input id="city" autocomplete="address-level2" placeholder="Lille"></div>
      </div>
      <div class="f"><label for="domain" id="lDomain"></label><select id="domain"></select></div>
      <div class="f"><label for="role" id="lRole"></label><select id="role"></select></div>
      <div class="f"><label for="biz" id="lBiz"></label><textarea id="biz" maxlength="300"></textarea></div>
      <div class="f"><label for="seek" id="lSeek"></label><textarea id="seek" maxlength="300"></textarea></div>
      <div class="f"><label for="skills" id="lSkills"></label><textarea id="skills" maxlength="400"></textarea></div>

async function saveProfile(e){
  e.preventDefault();
  var p={first:$("first").value.trim(),last:$("last").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim(),country:$("country").value,city:$("city").value.trim(),domain:$("domain").value,role:$("role").value,biz:$("biz").value.trim(),seek:$("seek").value.trim(),skills:$("skills").value.trim()};
  if(!p.first||!p.last||!p.phone||!p.city){toast(t("req"));return}
  if(!$("consent").checked){toast(t("consentReq"));return}
  var old=mine();p.createdAt=old&&old.createdAt?old.createdAt:Date.now();p.updatedAt=Date.now();
  try{
    if(mode==="shared")await B.save(p);
    else{p.id="me";profiles=profiles.filter(function(x){return x.id!=="me"});profiles.push(p);store("mre_profiles_v2",JSON.stringify(profiles))}
    toast(t("saved"));stack=[];view={p:"dir"};window.scrollTo(0,0);render();
  }catch(err){
    if(err&&err.code==="invalid_argument"){mode="ro";renderForm();toast(t("ro"))}else toast(t("err"));
  }
}
async function delProfile(){
  if(armed!==true){armed=true;renderForm();setTimeout(function(){armed=false;if(view.p==="form")renderForm()},4000);return}
  armed=false;
  try{
    if(mode==="shared")await B.del();
    else{profiles=profiles.filter(function(x){return x.id!=="me"});store("mre_profiles_v2",JSON.stringify(profiles))}
    ["first","last","phone","email","city","biz","seek","skills"].forEach(function(i){$(i).value=""});$("consent").checked=false;
    toast(t("deleted"));stack=[];view={p:"dir"};render();
  }catch(err){toast(t("err"))}
}

/* ================= connexion à la base partagée ================= */
function localLoad(){var r=store("mre_profiles_v2");try{return r?JSON.parse(r):[]}catch(e){return []}}
function rowOut(r){return {id:r.id,first:r.first_name,last:r.last_name,phone:r.phone,email:r.email||"",country:r.country,city:r.city,domain:r.domain,role:r.role||"",biz:r.biz||"",seek:r.seek||"",skills:r.skills||"",createdAt:r.created_at?Date.parse(r.created_at):0}}
function rowIn(p,id){return {id:id,first_name:p.first,last_name:p.last,phone:p.phone,email:p.email,country:p.country,city:p.city,domain:p.domain,role:p.role||"",biz:p.biz,seek:p.seek,skills:p.skills,updated_at:new Date().toISOString()}}
/* Supabase : annuaire commun (fichier HTML autonome) */
async function connectSupabase(){
  if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase||!window.supabase.createClient)return false;
  try{
    var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var s=(await sb.auth.getSession()).data.session;
    if(!s){var r=await sb.auth.signInAnonymously();if(r.error)throw r.error;s=r.data.session}
    uid=s.user.id;
    var reload=async function(){
      var a=await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(2000);
      if(!a.error)profiles=a.data.map(rowOut);
      var b=await sb.from("votes").select("id,choice");
      if(!b.error)votes=b.data;
      if(view.p==="form")renderForm();else render();
    };
    B={save:async function(p){var r=await sb.from("profiles").upsert(rowIn(p,uid));if(r.error)throw r.error;await reload()},
       del:async function(){var r=await sb.from("profiles").delete().eq("id",uid);if(r.error)throw r.error;await reload()},
       vote:async function(k){var r=await sb.from("votes").upsert({id:uid,choice:k});if(r.error)throw r.error;await reload()},
       rm:async function(){throw new Error("not allowed")}};
    var first=await sb.from("profiles").select("id").limit(1);
    if(first.error)throw first.error;
    mineId=uid;mode="shared";profiles=[];votes=[];
    await reload();
    try{sb.channel("mre").on("postgres_changes",{event:"*",schema:"public",table:"profiles"},reload).on("postgres_changes",{event:"*",schema:"public",table:"votes"},reload).subscribe()}catch(e){}
    setInterval(function(){if(!document.hidden&&view.p!=="form")reload()},60000);
    return true;
  }catch(e){return false}
}
/* Base partagée de l'artifact Claude (si la page est ouverte là-bas) */
async function connectClaude(){
  var c=window.claude;if(!c||!c.use)return;
  try{
    var d=await c.use("db"),u=await c.use("user");if(!d||!u)return;
    var id=await u.id();if(!id)return;
    db=d;uid=id;mineId=id;mode="shared";
    B={save:function(p){return db.doc("profiles/"+uid).set(p)},del:function(){return db.doc("profiles/"+uid).delete()},vote:function(k){return db.doc("votes/"+uid).set({choice:k,at:Date.now()})},rm:function(i){return db.doc("profiles/"+i).delete()}};
    try{isAdmin=!!(u.canEdit&&u.canEdit())}catch(e){}
    try{if(u.can&&u.can("data.write")===false)mode="ro"}catch(e){}
    profiles=[];votes=[];
    db.collection("profiles").onSnapshot(function(s){profiles=s.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o});if(view.p!=="form")render();else renderForm()},function(){mode="local";mineId="me";profiles=localLoad();render()});
    db.collection("votes").onSnapshot(function(s){votes=s.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o});if(view.p==="poll")render()},function(){});
    render();
  }catch(e){}
}
async function connect(){if(await connectSupabase())return;await connectClaude()}

lang=L[sv]?sv:(nav==="nl-be"?"nlbe":(L[nav.slice(0,2)]?nav.slice(0,2):"fr"));

if(hs==="annuaire")view={p:"dir"};else if(hs==="poles")view={p:"poles"};else if(hs==="sondage")view={p:"poll"};else if(hs==="energies")view={p:"energy"};else if(hs==="inscription")view={p:"form"};else if(hs==="business")view={p:"biz"};else if(hs==="confidentialite")view={p:"privacy"};
applyLang();if(view.p==="form")fillForm();
connect();
