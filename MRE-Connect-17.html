<style>
/* Concept: premium dark + gold, one scrolling page per menu entry, a draggable 3D globe as the hero, gold buttons that breathe slowly like LEDs */
:root{
  --bg:#070b17; --bg2:#0d1428; --surf:#121b33; --surf2:#1a274b; --glass:rgba(18,27,51,.72);
  --gold:#d4af37; --gold2:#f3d775; --goldDim:rgba(212,175,55,.18); --red:#c41e3a; --green:#006233; --green2:#0f9d58; --blue:#1f5fbf;
  --ink:#eef2ff; --dim:#9aa3c2; --line:rgba(212,175,55,.2); --line2:rgba(212,175,55,.42); --danger:#ff7a7a;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;min-height:100vh;
  background:radial-gradient(ellipse at 20% -10%,rgba(212,175,55,.13),transparent 50%),radial-gradient(ellipse at 90% 30%,rgba(196,30,58,.12),transparent 45%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px,rgba(212,175,55,.1) 1px,transparent 0),linear-gradient(45deg,rgba(212,175,55,.035) 25%,transparent 0,transparent 75%,rgba(212,175,55,.035) 0),linear-gradient(-45deg,rgba(212,175,55,.035) 25%,transparent 0,transparent 75%,rgba(212,175,55,.035) 0);
  background-size:28px 28px,56px 56px,56px 56px}
h1,h2,h3,.serif{font-family:var(--serif);text-wrap:balance}
button{font-family:inherit;cursor:pointer}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto}
/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;background:var(--bg);border-bottom:1px solid rgba(212,175,55,.14)}
.logo{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;color:var(--ink);text-align:start}
.logo i{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;box-shadow:0 0 0 1px rgba(212,175,55,.35),0 4px 14px rgba(0,0,0,.4)}.logo i img{width:100%;height:100%;display:block;border-radius:50%}
.logo b{font:700 11px var(--sans);letter-spacing:.2em;color:var(--gold2);line-height:1.3}
.logo b span{display:block;color:var(--dim);font-weight:500;letter-spacing:.08em;font-size:10px}
.sel{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.5rem .8rem;font:600 .8rem var(--sans)}
.sel option{background:var(--surf)}
.langw{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;padding:.5rem .8rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--gold2);font:700 .8rem var(--sans)}

.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:.9rem 1.4rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--ink);font:700 .92rem var(--sans);text-decoration:none;animation:breatheSoft 4.2s ease-in-out infinite alternate}
.danger{border-color:rgba(255,122,122,.5);color:var(--danger)}
@keyframes breathe{from{box-shadow:0 0 6px rgba(212,175,55,.18),0 6px 18px rgba(212,175,55,.12);filter:brightness(.88)}to{box-shadow:0 0 22px rgba(243,215,117,.65),0 10px 34px rgba(212,175,55,.42);filter:brightness(1.08)}}
@keyframes breatheSoft{from{box-shadow:0 0 0 rgba(212,175,55,0);border-color:rgba(255,255,255,.14)}to{box-shadow:0 0 16px rgba(212,175,55,.28);border-color:var(--line2)}}
@keyframes led{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view>*{animation:rise .35s ease both}
/* accueil */

.leds{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.4rem .9rem;font:700 .68rem var(--sans);letter-spacing:.18em;color:var(--gold2)}

.h1{overflow-wrap:anywhere;font:700 clamp(2.1rem,9.5vw,4.2rem)/1 var(--serif);letter-spacing:-.02em}

.live{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:#6ee7b7;border-radius:999px;padding:.25rem .7rem;font:800 .62rem var(--sans);letter-spacing:.1em}

priv:[["Qué recogemos","Lo que introduces en tu perfil: nombre, apellidos, teléfono, correo (opcional), país, ciudad, sector, perfil de negocio, actividad, lo que buscas y habilidades. También se guarda tu voto en la encuesta. Si te conectas por correo, esa dirección se asocia a tu cuenta."],

["Para qué","Solo para que los MRE puedan encontrarse y contactarse. Sin publicidad ni venta de datos."],
["Dónde se guardan","En una base de datos Supabase alojada en Europa. La página se aloja en GitHub Pages. Las donaciones pasan por PayPal, independiente de MRE Connect."],
["Tus derechos","Puedes modificar tu perfil, cambiar lo que compartes o borrarlo todo en cualquier momento desde «Mi perfil». El botón «Eliminar mi perfil y mis datos» borra tu perfil, teléfono, correo, voto y cuenta. Para cualquier petición, escríbenos al contacto indicado abajo."],
["Denuncias y prudencia","Los perfiles no están verificados. Puedes denunciar un perfil sospechoso desde su ficha; revisamos las denuncias y podemos retirar un perfil. Nunca envíes dinero a alguien que no conozcas ni compartas documentos personales."],
["Seguridad e incidentes","Los contactos se guardan en una tabla privada protegida en el servidor: ocultar un campo en la aplicación no basta, es realmente inaccesible sin permiso. Si se produjera una fuga de datos, se avisaría rápidamente a los miembros afectados."],

["Quem vê o quê","Nome, apelido, cidade, país, setor e dados profissionais são visíveis no diretório para qualquer pessoa que abra a aplicação. O seu telefone e e-mail só são visíveis se marcar a caixa de partilha, e só por membros ligados por e-mail, com o limite de 40 contactos por dia por membro. Estas consultas são registadas durante 90 dias para detetar abusos."],
["Porquê","Apenas para permitir que os MRE se encontrem e contactem. Sem publicidade nem venda de dados."],
["Onde ficam os dados","Numa base de dados Supabase alojada na Europa. A página está alojada no GitHub Pages. Os donativos passam pelo PayPal, independente do MRE Connect."],
["Os seus direitos","Pode alterar o perfil, mudar o que partilha ou apagar tudo a qualquer momento em «O meu perfil». O botão «Eliminar o meu perfil e os meus dados» apaga o perfil, telefone, e-mail, voto e conta. Para qualquer pedido, escreva para o contacto abaixo."],
["Denúncias e prudência","Os perfis não são verificados. Pode denunciar um perfil suspeito a partir da sua ficha; analisamos as denúncias e podemos remover um perfil. Nunca envie dinheiro a quem não conhece nem partilhe documentos pessoais."],
["Segurança e incidentes","Os contactos ficam numa tabela privada protegida no servidor: esconder um campo na aplicação não chega, ele está realmente inacessível sem autorização. Em caso de fuga de dados, os membros afetados seriam informados rapidamente."],
["Cookies e rastreio","A aplicação não tem publicidade nem ferramentas de rastreio. Guarda apenas no navegador o seu idioma e a sessão de ligação."]]},

["Chi vede cosa","Nome, cognome, città, paese, settore e dati professionali sono visibili nell'elenco a chiunque apra l'app. Telefono ed e-mail sono visibili solo se spunti la casella di condivisione, e solo ai membri collegati via e-mail, con un limite di 40 contatti al giorno per membro. Queste consultazioni sono registrate per 90 giorni per individuare abusi."],
["Perché","Solo per permettere agli MRE di trovarsi e contattarsi. Nessuna pubblicità, nessuna vendita di dati."],
["Dove sono i dati","In un database Supabase ospitato in Europa. La pagina è ospitata su GitHub Pages. Le donazioni passano da PayPal, indipendente da MRE Connect."],
["I tuoi diritti","Puoi modificare il profilo, cambiare ciò che condividi o cancellare tutto in qualsiasi momento da «Il mio profilo». Il pulsante «Elimina il mio profilo e i miei dati» cancella profilo, telefono, e-mail, voto e account. Per qualsiasi richiesta scrivi al contatto qui sotto."],
["Segnalazioni e prudenza","I profili non sono verificati. Puoi segnalare un profilo sospetto dalla sua scheda; esaminiamo le segnalazioni e possiamo rimuovere un profilo. Non inviare mai denaro a chi non conosci e non condividere documenti personali."],
["Sicurezza e incidenti","I contatti sono in una tabella privata protetta sul server: nascondere un campo nell'app non basta, è davvero inaccessibile senza autorizzazione. In caso di fuga di dati, i membri interessati sarebbero avvisati rapidamente."],
["Cookie e tracciamento","L'app non ha pubblicità né strumenti di tracciamento. Conserva solo nel browser la lingua e la sessione di accesso."]]},

del:"Mijn profiel en gegevens verwijderen",
priv:[["Wat we verzamelen","Wat je in je profiel invult: voornaam, achternaam, telefoon, e-mail (optioneel), land, stad, sector, bedrijfsprofiel, activiteit, wat je zoekt en vaardigheden. Je stem in de peiling wordt ook bewaard. Log je in met e-mail, dan hoort dat adres bij je account."],
["Wie wat ziet","Voornaam, achternaam, stad, land, sector en beroepsgegevens zijn in de gids zichtbaar voor iedereen die de app opent. Je telefoon en e-mail zijn alleen zichtbaar als je het deelvakje aanvinkt, en alleen voor leden die met e-mail zijn ingelogd, met een limiet van 40 contacten per dag per lid. Deze inzages worden 90 dagen bewaard om misbruik op te sporen."],
["Waarom","Alleen zodat MRE elkaar kunnen vinden en contacteren. Geen reclame, geen verkoop van gegevens."],
["Waar de gegevens staan","In een Supabase-database in Europa. De app-pagina staat op GitHub Pages. Giften lopen via PayPal, dat los staat van MRE Connect."],
["Jouw rechten","Je kunt je profiel wijzigen, aanpassen wat je deelt of alles verwijderen via ‘Mijn profiel’. De knop ‘Mijn profiel en gegevens verwijderen’ wist je profiel, telefoon, e-mail, stem en account. Voor elke vraag schrijf je naar het contactadres hieronder."],
["Meldingen en voorzichtigheid","Profielen worden niet geverifieerd. Je kunt een verdacht profiel melden via zijn pagina; we bekijken meldingen en kunnen een profiel verwijderen. Stuur nooit geld naar iemand die je niet kent en deel geen persoonlijke documenten."],
["Beveiliging en incidenten","Contacten staan in een privétabel die op de server beveiligd is: een veld verbergen in de app is niet genoeg, het is echt ontoegankelijk zonder toestemming. Bij een datalek worden de betrokken leden snel verwittigd."],
["Cookies en tracking","De app heeft geen reclame of trackingtools. Ze bewaart alleen je taal en je inlogsessie in je browser."]]},

del:"Mein Profil und meine Daten löschen",
priv:[["Was wir erfassen","Was du im Profil angibst: Vorname, Nachname, Telefon, E-Mail (optional), Land, Stadt, Branche, Business-Profil, Tätigkeit, Suche und Kompetenzen. Auch deine Stimme in der Umfrage wird gespeichert. Meldest du dich per E-Mail an, wird diese Adresse deinem Konto zugeordnet."],
["Wer was sieht","Vorname, Nachname, Stadt, Land, Branche und berufliche Angaben sind im Verzeichnis für jeden sichtbar, der die App öffnet. Telefon und E-Mail sind nur sichtbar, wenn du das Freigabe-Kästchen ankreuzt, und nur für per E-Mail angemeldete Mitglieder, mit einem Limit von 40 Kontakten pro Tag und Mitglied. Diese Abrufe werden 90 Tage protokolliert, um Missbrauch zu erkennen."],
["Warum","Nur damit sich MRE finden und kontaktieren können. Keine Werbung, kein Datenverkauf."],
["Wo die Daten liegen","In einer Supabase-Datenbank in Europa. Die App-Seite liegt auf GitHub Pages. Spenden laufen über PayPal, unabhängig von MRE Connect."],
["Deine Rechte","Du kannst dein Profil ändern, die Freigaben anpassen oder alles löschen, jederzeit unter „Mein Profil“. Die Schaltfläche „Mein Profil und meine Daten löschen“ entfernt Profil, Telefon, E-Mail, Stimme und Konto. Für Anfragen schreibe an die Kontaktadresse unten."],
["Meldungen und Vorsicht","Profile werden nicht geprüft. Du kannst ein verdächtiges Profil auf seiner Seite melden; wir prüfen Meldungen und können ein Profil entfernen. Sende nie Geld an Unbekannte und gib keine persönlichen Dokumente weiter."],
["Sicherheit und Vorfälle","Kontakte liegen in einer privaten Tabelle, die serverseitig geschützt ist: Ein Feld in der App zu verbergen genügt nicht, es ist ohne Berechtigung wirklich unzugänglich. Bei einem Datenleck würden betroffene Mitglieder zügig informiert."],
["Cookies und Tracking","Die App hat keine Werbung und keine Tracking-Tools. Sie speichert nur deine Sprache und deine Anmeldesitzung im Browser."]]},

del:"حذف ملفي وبياناتي",
priv:[["ما الذي نجمعه","ما تدخله في ملفك: الاسم الشخصي والعائلي والهاتف والبريد الإلكتروني (اختياري) والبلد والمدينة والقطاع والملف المهني والنشاط وما تبحث عنه والمهارات. كما يُسجَّل تصويتك في الاستطلاع. وإذا سجلت الدخول بالبريد الإلكتروني فإن هذا العنوان يرتبط بحسابك."],
["من يرى ماذا","الاسم الشخصي والعائلي والمدينة والبلد والقطاع والمعلومات المهنية ظاهرة في الدليل لكل من يفتح التطبيق. أما هاتفك وبريدك الإلكتروني فلا يظهران إلا إذا وضعت علامة المشاركة، ولا يراهما إلا الأعضاء المتصلون بالبريد الإلكتروني، بحد أقصى 40 جهة اتصال في اليوم لكل عضو. تُسجَّل هذه الاطلاعات لمدة 90 يومًا لكشف إساءة الاستخدام."],
["لماذا","فقط لتمكين مغاربة العالم من إيجاد بعضهم والتواصل. لا إعلانات ولا بيع للبيانات."],
["أين تُخزَّن البيانات","في قاعدة بيانات Supabase مستضافة في أوروبا. وصفحة التطبيق مستضافة على GitHub Pages. أما التبرعات فتمر عبر PayPal المستقل عن MRE Connect."],
["حقوقك","يمكنك تعديل ملفك أو تغيير ما تشاركه أو حذف كل شيء في أي وقت من «ملفي». زر «حذف ملفي وبياناتي» يمحو ملفك وهاتفك وبريدك وتصويتك وحسابك. لأي طلب راسلنا على عنوان التواصل أدناه."],
["البلاغات والحذر","الملفات غير موثَّقة. يمكنك الإبلاغ عن ملف مشبوه من صفحته؛ نراجع البلاغات ويمكننا إزالة ملف. لا ترسل مالًا لشخص لا تعرفه ولا تشارك وثائق شخصية."],
["الأمان والحوادث","تُحفظ وسائل التواصل في جدول خاص محمي على الخادم: إخفاء حقل في التطبيق لا يكفي، فهو غير قابل للوصول فعليًا دون إذن. وفي حال حدوث تسريب للبيانات سيُبلَّغ الأعضاء المعنيون بسرعة."],
["ملفات الارتباط والتتبع","لا يحتوي التطبيق على إعلانات ولا أدوات تتبع. يحتفظ فقط في متصفحك بلغتك وجلسة الدخول."]]}

async function doReveal(id){
  if(!secure)return;
  if(!hasMail){pend=id;openAuth();return}
  try{
    var r=await sbc.rpc("reveal_contact",{target:id});if(r.error)throw r.error;
    var row=(r.data&&r.data[0])||{};revealed[id]={phone:row.phone||"",email:row.email||""};render();
  }catch(e){
    var m=String((e&&e.message)||"");
    if(m.indexOf("rate_limit")>=0)toast(t("rate"));
    else if(m.indexOf("login_required")>=0){hasMail=false;pend=id;openAuth()}
    else toast(t("err"));
  }
}
async function doReport(id){
  if(armed!=="r"+id){armed="r"+id;render();setTimeout(function(){if(armed==="r"+id){armed=false;if(view.p==="fiche")render()}},4000);return}
  armed=false;
  try{var r=await sbc.from("reports").insert({reporter:uid,target:id});
    if(r.error&&r.error.code!=="23505")throw r.error;toast(t("reported"));render();
  }catch(e){toast(t("err"))}
}
/* connexion par e-mail (code à 6 chiffres) : conserve le profil actuel */
function openAuth(){
  authFlow="";$("aT").textContent=t("aT");$("aP").textContent=t("aP");$("aMail").placeholder=t("aMailPh");$("aCode").placeholder=t("aCodePh");
  $("aGo").textContent=t("aGo1");$("aX").textContent=t("aX");$("aE").hidden=false;$("aC").hidden=true;$("aCode").value="";
  $("auth").hidden=false;setTimeout(function(){try{$("aMail").focus()}catch(e){}},50);
}
function closeAuth(){$("auth").hidden=true;pend=null}
async function authGo(){
  if(!sbc)return;
  var btn=$("aGo");
  if(authFlow!=="code"){
    var em=$("aMail").value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(em)){toast(t("aBad"));return}
    btn.disabled=true;
    try{
      var cur=(await sbc.auth.getUser()).data.user,anon=!!cur&&!cur.email,r,kind;
      if(anon){r=await sbc.auth.updateUser({email:em});kind="email_change";
        if(r.error&&/already|registered|exists/i.test(String(r.error.code||"")+" "+String(r.error.message||""))){
          r=await sbc.auth.signInWithOtp({email:em,options:{shouldCreateUser:false}});kind="email"}
      }else{r=await sbc.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});kind="email"}
      if(r.error)throw r.error;
      authFlow="code";authMail=em;authKind=kind;
      $("aE").hidden=true;$("aC").hidden=false;btn.textContent=t("aGo2");toast(t("aSent"));try{$("aCode").focus()}catch(e){}
    }catch(e){toast(t("aErr"))}
    btn.disabled=false;return;
  }
  var code=$("aCode").value.replace(/\s/g,"");
  if(code.length<4){toast(t("aCodeBad"));return}
  btn.disabled=true;
  try{
    var v=await sbc.auth.verifyOtp({email:authMail,token:code,type:authKind});
    if(v.error)throw v.error;
    try{await sbc.auth.refreshSession()}catch(e){}
    var u=(await sbc.auth.getUser()).data.user;
    if(!u||!u.email)throw new Error("no email");
    uid=u.id;mineId=u.id;hasMail=true;revealed={};
    var id=pend;pend=null;$("auth").hidden=true;
    if(sbReload)await sbReload();
    if(id)doReveal(id);
  }catch(e){toast(t("aCodeBad"))}
  btn.disabled=false;
}

async function saveRoad(f){
  var m=mine();
  if(!m){toast(t("rNeedP"));stack.push(view);view={p:"form"};render();fillForm();return}
  var g=function(n){return f.elements[n]?f.elements[n].value.trim():""};
  var k=g("kind");if(["queue","price","alert"].indexOf(k)<0)return;
  var r={kind:k,place:g("place"),minutes:null,price:null,alert_type:null,note:g("note").slice(0,200)||null};
  if(!PL.hasOwnProperty(r.place)){toast(t("iBad"));return}
  if(k==="queue"){r.minutes=parseInt(g("minutes"),10);if(!(r.minutes>=0&&r.minutes<=600)){toast(t("iBad"));return}}
  if(k==="price"){r.price=parseInt(g("price"),10);if(!(r.price>=10&&r.price<=2000)||PORTS.indexOf(r.place)<0){toast(t("iBad"));return}}
  if(k==="alert"){r.alert_type=g("atype");if(["theft","scam","danger"].indexOf(r.alert_type)<0||!r.note||r.note.length<5){toast(t("iBad"));return}}
  if(!f.elements.cons.checked){toast(t("rCReq"));return}
  var day=Date.now()-864e5;
  if(road.filter(function(x){return x.owner===mineId&&new Date(x.created_at).getTime()>day}).length>=5){toast(t("iLimit"));return}
  try{
    if(mode==="shared"&&B&&B.roadSave){r.owner=uid;await B.roadSave(r)}
    else{r.owner=mineId;r.id="l"+Date.now();r.created_at=new Date().toISOString();var a=roadLocal();a.push(r);store("mre_road",JSON.stringify(a));road=a}
    toast(t("iSaved"));rTab="info";stack=[];view={p:"rides"};window.scrollTo(0,0);render();
  }catch(e){toast(String((e&&e.message)||"").indexOf("road_limit")>=0?t("iLimit"):t("err"))}
}

    if(view.p==="home")h=pageHome();else if(view.p==="dir")h=pageDir();else if(view.p==="fiche")h=pageFiche(view.a);
    else if(view.p==="poles")h=pagePoles();else if(view.p==="pole")h=pagePole(view.a);else if(view.p==="poll")h=pagePoll();else if(view.p==="biz")h=pageBiz();else if(view.p==="privacy")h=pagePrivacy();else if(view.p==="energy")h=pageEnergy();else if(view.p==="rides")h=pageRides();else if(view.p==="rpost")h=pageRidePost();else if(view.p==="ipost")h=pageRoadPost();

    if(mode==="shared")await B.save(p);
    else{p.id="me";profiles=profiles.filter(function(x){return x.id!=="me"});profiles.push(p);store("mre_profiles_v2",JSON.stringify(profiles))}
    toast(t("saved"));stack=[];view={p:"dir"};window.scrollTo(0,0);render();
  }catch(err){
    if(err&&err.code==="invalid_argument"){mode="ro";renderForm();toast(t("ro"))}else toast(t("err"));
  }
}

/* ================= connexion à la base partagée ================= */
function localLoad(){var r=store("mre_profiles_v2");try{return r?JSON.parse(r):[]}catch(e){return []}}
function rowOut(r){return {id:r.id,first:r.first_name,last:r.last_name,country:r.country,city:r.city,domain:r.domain,role:r.role||"",biz:r.biz||"",seek:r.seek||"",skills:r.skills||"",createdAt:r.created_at?Date.parse(r.created_at):0}}
function rowIn(p,id){return {id:id,first_name:p.first,last_name:p.last,country:p.country,city:p.city,domain:p.domain,role:p.role||"",biz:p.biz,seek:p.seek,skills:p.skills,updated_at:new Date().toISOString()}}
/* Supabase : annuaire commun (fichier HTML autonome) */
async function connectSupabase(){
  if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase||!window.supabase.createClient)return false;
  try{
    var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    sbc=sb;
    var s=(await sb.auth.getSession()).data.session;
    if(!s){var r=await sb.auth.signInAnonymously();if(r.error)throw r.error;s=r.data.session}
    uid=s.user.id;hasMail=!!s.user.email;
    try{sb.auth.onAuthStateChange(function(ev,ses){hasMail=!!(ses&&ses.user&&ses.user.email)})}catch(e){}
    var reload=async function(){
      var a=await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(2000);
      if(!a.error)profiles=a.data.map(rowOut);
      var b=await sb.from("votes").select("id,choice");
      if(!b.error)votes=b.data;
      var rr=await sb.from("rides").select("*").gte("depart_date",todayStr()).order("depart_date",{ascending:true}).limit(500);
      if(!rr.error){rides=rr.data;ridesOK=true}else ridesOK=false;
      var rd=await sb.from("road_posts").select("*").order("created_at",{ascending:false}).limit(300);
      if(!rd.error){road=rd.data;roadOK=true}else roadOK=false;
      try{var ad=await sb.rpc("is_admin");isMod=!!(ad&&!ad.error&&ad.data===true)}catch(e){isMod=false}
      var c=await sb.from("contacts").select("*").eq("id",uid).maybeSingle();
      myC=(!c.error&&c.data)?c.data:null;
      if(view.p==="form")renderForm();else if(view.p!=="rpost"&&view.p!=="ipost")render();
    };
    B={save:async function(p){var r=await sb.from("profiles").upsert(rowIn(p,uid));if(r.error)throw r.error;
         var k=await sb.from("contacts").upsert({id:uid,phone:p.phone,email:p.email||null,share_phone:!!p.shareP,share_email:!!p.shareE,updated_at:new Date().toISOString()});if(k.error)throw k.error;await reload()},
       del:async function(){var r=await sb.rpc("delete_my_account");if(r.error)throw r.error;
         try{await sb.auth.signOut()}catch(e){}
         var n=await sb.auth.signInAnonymously();if(n.error)throw n.error;
         uid=n.data.session.user.id;mineId=uid;myC=null;revealed={};hasMail=false;await reload()},
       vote:async function(k){var r=await sb.from("votes").upsert({id:uid,choice:k});if(r.error)throw r.error;await reload()},
       rideSave:async function(r){var x=await sb.from("rides").insert(r);if(x.error)throw x.error;await reload()},
       roadSave:async function(r){var x=await sb.from("road_posts").insert(r);if(x.error)throw x.error;await reload()},
       roadDel:async function(id){var x=await sb.from("road_posts").delete().eq("id",id);if(x.error)throw x.error;await reload()},
       rideDel:async function(id){var x=await sb.from("rides").delete().eq("id",id);if(x.error)throw x.error;await reload()},
       rm:async function(){throw new Error("not allowed")}};
    var first=await sb.from("profiles").select("id").limit(1);
    if(first.error)throw first.error;
    mineId=uid;mode="shared";secure=true;profiles=[];votes=[];sbReload=reload;
    await reload();
    try{sb.channel("mre").on("postgres_changes",{event:"*",schema:"public",table:"profiles"},reload).on("postgres_changes",{event:"*",schema:"public",table:"votes"},reload).subscribe()}catch(e){}
    setInterval(function(){if(!document.hidden&&view.p!=="form"&&view.p!=="rpost"&&view.p!=="ipost")reload()},60000);
    return true;
  }catch(e){return false}
}
/* Base partagée de l'artifact Claude (si la page est ouverte là-bas) */
async function connectClaude(){
  var c=window.claude;if(!c||!c.use)return;
  try{
    var d=await c.use("db"),u=await c.use("user");if(!d||!u)return;
    var id=await u.id();if(!id)return;
    db=d;uid=id;mineId=id;mode="shared";
    B={save:function(p){return db.doc("profiles/"+uid).set(p)},del:function(){return db.doc("profiles/"+uid).delete()},vote:function(k){return db.doc("votes/"+uid).set({choice:k,at:Date.now()})},rm:function(i){return db.doc("profiles/"+i).delete()}};
    try{isAdmin=!!(u.canEdit&&u.canEdit())}catch(e){}
    try{if(u.can&&u.can("data.write")===false)mode="ro"}catch(e){}
    profiles=[];votes=[];
    db.collection("profiles").onSnapshot(function(s){profiles=s.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o});if(view.p!=="form")render();else renderForm()},function(){mode="local";mineId="me";profiles=localLoad();render()});
    db.collection("votes").onSnapshot(function(s){votes=s.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o});if(view.p==="poll")render()},function(){});
    render();
  }catch(e){}
}
async function connect(){if(await connectSupabase())return;await connectClaude()}
