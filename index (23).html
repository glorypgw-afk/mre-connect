<style>
/* Concept: premium dark + gold, one scrolling page per menu entry, a draggable 3D globe as the hero, gold buttons that breathe slowly like LEDs */
:root{
  --bg:#070b17; --bg2:#0d1428; --surf:#121b33; --surf2:#1a274b; --glass:rgba(18,27,51,.72);
  --gold:#d4af37; --gold2:#f3d775; --goldDim:rgba(212,175,55,.18); --red:#c41e3a; --green:#006233; --green2:#0f9d58; --blue:#1f5fbf;
  --ink:#eef2ff; --dim:#9aa3c2; --line:rgba(212,175,55,.2); --line2:rgba(212,175,55,.42); --danger:#ff7a7a;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;min-height:100vh;
  background:radial-gradient(ellipse at 20% -10%,rgba(212,175,55,.13),transparent 50%),radial-gradient(ellipse at 90% 30%,rgba(196,30,58,.12),transparent 45%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.12;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60' fill='none' stroke='%23d4af37' stroke-width='1'><circle cx='0' cy='0' r='30'/><circle cx='60' cy='0' r='30'/><circle cx='0' cy='60' r='30'/><circle cx='60' cy='60' r='30'/><circle cx='30' cy='30' r='30'/></svg>");background-size:60px 60px}
h1,h2,h3,.serif{font-family:var(--serif);text-wrap:balance}
button{font-family:inherit;cursor:pointer}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto}
/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;margin-top:6px;border-radius:22px;background:rgba(13,20,40,.92);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.mapma{height:50px;width:auto;flex:0 1 auto;min-width:0;max-width:30%;opacity:.95;filter:drop-shadow(0 0 6px rgba(212,175,55,.25))}
.logo{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;color:var(--ink);text-align:start}
.logo i{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;box-shadow:0 0 0 1px rgba(212,175,55,.35),0 4px 14px rgba(0,0,0,.4)}.logo i img{width:100%;height:100%;display:block;border-radius:50%}
.logo b{font:700 11px var(--sans);letter-spacing:.2em;color:var(--gold2);line-height:1.3}
.logo b span{display:block;color:var(--dim);font-weight:500;letter-spacing:.08em;font-size:10px}
.sel{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.5rem .8rem;font:600 .8rem var(--sans)}
.sel option{background:var(--surf)}
.langw{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;padding:.5rem .8rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--gold2);font:700 .8rem var(--sans)}
.langw select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;border:0;padding:0}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--gold2);border-radius:999px;padding:.45rem .9rem;font:700 .8rem var(--sans);margin-bottom:14px}
/* boutons : lueur dorée qui respire */
.cta{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:.95rem 1.6rem;background:var(--gold);color:#0b0f1d;font:800 .95rem var(--sans);letter-spacing:.02em;text-decoration:none;animation:breathe 3.4s ease-in-out infinite alternate}
.cta:active{transform:scale(.98)}
.cta.wa{background:#25D366;color:#fff;animation:breatheWa 3.4s ease-in-out infinite alternate}
@keyframes breatheWa{from{box-shadow:0 0 6px rgba(37,211,102,.2),0 6px 18px rgba(37,211,102,.14);filter:brightness(.92)}to{box-shadow:0 0 22px rgba(37,211,102,.6),0 10px 34px rgba(37,211,102,.4);filter:brightness(1.08)}}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:.9rem 1.4rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--ink);font:700 .92rem var(--sans);text-decoration:none;animation:breatheSoft 4.2s ease-in-out infinite alternate}
.danger{border-color:rgba(255,122,122,.5);color:var(--danger)}
@keyframes breathe{from{box-shadow:0 0 6px rgba(212,175,55,.18),0 6px 18px rgba(212,175,55,.12);filter:brightness(.88)}to{box-shadow:0 0 22px rgba(243,215,117,.65),0 10px 34px rgba(212,175,55,.42);filter:brightness(1.08)}}
@keyframes breatheSoft{from{box-shadow:0 0 0 rgba(212,175,55,0);border-color:rgba(255,255,255,.14)}to{box-shadow:0 0 16px rgba(212,175,55,.28);border-color:var(--line2)}}
@keyframes led{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view>*{animation:rise .35s ease both}
/* accueil */
.hero{position:relative;padding-block:18px 8px;display:flex;flex-direction:column;gap:18px}
.leds{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leds s{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold);animation:led 4s ease-in-out infinite}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.4rem .9rem;font:700 .68rem var(--sans);letter-spacing:.18em;color:var(--gold2)}
.pill s{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:led 2.6s ease-in-out infinite}
.h1{overflow-wrap:anywhere;font:700 clamp(2.1rem,9.5vw,4.2rem)/1 var(--serif);letter-spacing:-.02em}
.h1 em{display:block;font-style:normal;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--dim);font-size:1.08rem;max-width:36ch}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hero .row{max-width:460px}.hero .row>.cta,.hero .row>.ghost{flex:1 1 210px;min-width:0;text-align:center}
.vals{display:flex;gap:8px;flex-wrap:wrap}
.vals span{border:1px solid var(--line);border-radius:999px;padding:.28rem .8rem;font:700 .62rem var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(212,175,55,.08),0 20px 60px rgba(0,0,0,.5)}
.globeCard{padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flag{display:flex;align-items:center;gap:10px;font:700 .72rem var(--sans);letter-spacing:.14em}
.flag i{width:46px;height:32px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:var(--green2);font-style:normal;font-size:20px;border:1px solid rgba(255,255,255,.12)}
.flag small{display:block;color:var(--dim);font-weight:500;letter-spacing:.05em;font-size:.7rem}
.live{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:#6ee7b7;border-radius:999px;padding:.25rem .7rem;font:800 .62rem var(--sans);letter-spacing:.1em}
.live s{width:6px;height:6px;border-radius:50%;background:#34d399;animation:led 2s infinite}
#globeHost{position:relative;width:100%;aspect-ratio:1/1;max-height:520px;border-radius:22px;background:radial-gradient(circle at 50% 45%,#13204a 0%,#0a1026 62%,#070b17 100%);border:1px solid rgba(255,255,255,.08);overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#globe:active{cursor:grabbing}
.ghint{text-align:center;font-size:.75rem;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font:700 1.7rem/1 var(--serif);color:var(--gold2)}
.stat span{font:700 .6rem var(--sans);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.band{text-align:center;padding:26px 8px;display:flex;flex-direction:column;gap:6px}
.band h2{font:700 clamp(1.7rem,7vw,2.6rem)/1.05 var(--serif);color:var(--gold2)}
.band p{color:var(--dim)}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh h2{font:700 clamp(1.7rem,7vw,2.4rem)/1 var(--serif)}

.more{background:none;border:0;color:var(--gold2);font:700 .85rem var(--sans)}
.poles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.pole{display:flex;flex-direction:column;gap:10px;text-align:start;padding:14px;border-radius:18px;background:var(--surf);border:1px solid var(--line);color:var(--ink);min-width:0;transition:border-color .25s,box-shadow .25s,transform .1s}
.pole:hover{border-color:var(--line2);box-shadow:0 0 22px rgba(212,175,55,.18)}

.pole .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--goldDim);border:1px solid var(--line);animation:breatheSoft 4s ease-in-out infinite alternate}

.promo{position:relative;overflow:hidden;padding:24px 20px;display:flex;flex-direction:column;gap:12px}

/* annuaire */
.tools{display:grid;grid-template-columns:1fr;gap:10px}

input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:.8rem 1rem;width:100%;min-width:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mem{display:flex;flex-direction:column;gap:9px;text-align:start;padding:16px;border-radius:20px;background:var(--surf);border:1px solid var(--line);color:var(--ink);min-width:0;transition:border-color .25s,box-shadow .25s}

.av.big{width:74px;height:74px;font-size:1.7rem}
.nm{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.vrf{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:8px;padding:3px 9px 3px 6px;border-radius:99px;background:rgba(46,204,140,.16);border:1px solid rgba(46,204,140,.55);color:#7ff0bf;font-size:11.5px;font-weight:800;line-height:1.2;white-space:nowrap}.fnd{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin-left:8px;padding:3px 9px 3px 6px;border-radius:99px;background:linear-gradient(135deg,#fbe9a8,#d9a93a 55%,#a97c1a);color:#2a1d00;font-size:11.5px;font-weight:800;letter-spacing:.3px;line-height:1.2;white-space:nowrap;box-shadow:0 0 12px rgba(212,175,55,.28)}

.loc{font-size:.78rem;color:var(--dim)}
.tag{align-self:flex-start;border:1px solid rgba(212,175,55,.3);background:rgba(212,175,55,.12);color:var(--gold2);border-radius:999px;padding:.2rem .65rem;font:700 .68rem var(--sans)}
.sk{font-size:.83rem;color:rgba(238,242,255,.72);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* fiche */
.fiche{padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.fh{display:flex;gap:16px;align-items:center}
.fh h2{font:700 1.9rem/1.05 var(--serif);overflow-wrap:anywhere}

[dir="rtl"] .rarr{display:inline-block;transform:scaleX(-1)}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--gold2);background:var(--goldDim);box-shadow:0 0 14px rgba(212,175,55,.25)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--gold);color:#0b0f1d;padding:.7rem 1.1rem;border-radius:999px;font:800 .85rem var(--sans);transition:.25s;max-width:90vw;text-align:center;z-index:40;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var SPIRIT={"fr": {"spT": "Notre esprit", "spS": "Quelques paroles qui nous guident.", "sp": [["Les croyants ne sont que des frères. Établissez la concorde entre vos frères et craignez Allah, afin qu'Il vous fasse miséricorde.", "Coran, sourate Al-Hujurât (49), verset 10", "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ"], ["Le musulman est le frère du musulman : il ne l'opprime pas et ne l'abandonne pas. Celui qui s'occupe du besoin de son frère, Allah s'occupera de son besoin.", "Sahih al-Bukhari n° 2442 · Sahih Muslim n° 2580", "الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ"], ["Aucun d'entre vous ne croit [parfaitement] tant qu'il n'aime pas pour son frère ce qu'il aime pour lui-même.", "Sahih al-Bukhari n° 13 · Sahih Muslim n° 45", "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ"], ["Quiconque soulage un croyant d'une difficulté de ce monde, Allah le soulagera d'une difficulté du Jour de la Résurrection.", "Sahih Muslim n° 2699", "مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ"]]}, "en": {"spT": "Our spirit", "spS": "A few words that guide us.", "sp": [["The believers are but brothers, so make settlement between your brothers and fear Allah, that you may receive mercy.", "Quran, Surah Al-Hujurat (49), verse 10", "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ"], ["A Muslim is the brother of a Muslim: he does not wrong him and does not abandon him. Whoever takes care of his brother's need, Allah will take care of his need.", "Sahih al-Bukhari no. 2442 · Sahih Muslim no. 2580", "الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ"], ["None of you believes [fully] until he loves for his brother what he loves for himself.", "Sahih al-Bukhari no. 13 · Sahih Muslim no. 45", "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ"], ["Whoever relieves a believer of a hardship of this world, Allah will relieve him of a hardship on the Day of Resurrection.", "Sahih Muslim no. 2699", "مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ"]]}, "es": {"spT": "Nuestro espíritu", "spS": "Algunas palabras que nos guían.", "sp": [["Los creyentes no son sino hermanos. Reconciliad a vuestros hermanos y temed a Allah, para que se os conceda misericordia.", "Corán, sura Al-Hujurat (49), aleya 10", "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ"], ["El musulmán es el hermano del musulmán: no lo oprime ni lo abandona. A quien atiende la necesidad de su hermano, Allah atenderá su necesidad.", "Sahih al-Bukhari n.º 2442 · Sahih Muslim n.º 2580", "الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ"], ["Ninguno de vosotros cree [plenamente] hasta que desee para su hermano lo que desea para sí mismo.", "Sahih al-Bukhari n.º 13 · Sahih Muslim n.º 45", "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ"], ["Quien alivia a un creyente de una dificultad de este mundo, Allah lo aliviará de una dificultad el Día de la Resurrección.", "Sahih Muslim n.º 2699", "مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ"]]}, "pt": {"spT": "O nosso espírito", "spS": "Algumas palavras que nos guiam.", "sp": [["Os crentes são apenas irmãos. Restabelecei a concórdia entre os vossos irmãos e temei a Allah, para que vos seja concedida misericórdia.", "Alcorão, sura Al-Hujurat (49), versículo 10", "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ"], ["O muçulmano é irmão do muçulmano: não o oprime nem o abandona. A quem atende à necessidade do seu irmão, Allah atenderá à sua necessidade.", "Sahih al-Bukhari n.º 2442 · Sahih Muslim n.º 2580", "الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ"], ["Nenhum de vós crê [plenamente] até desejar para o seu irmão o que deseja para si mesmo.", "Sahih al-Bukhari n.º 13 · Sahih Muslim n.º 45", "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ"], ["Quem alivia um crente de uma dificuldade deste mundo, Allah aliviá-lo-á de uma dificuldade no Dia da Ressurreição.", "Sahih Muslim n.º 2699", "مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ"]]}, "it": {"spT": "Il nostro spirito", "spS": "Alcune parole che ci guidano.", "sp": [["I credenti sono soltanto fratelli. Riconciliate i vostri fratelli e temete Allah, affinché vi sia usata misericordia.", "Corano, sura Al-Hujurat (49), versetto 10", "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ"], ["Il musulmano è fratello del musulmano: non lo opprime e non lo abbandona. A chi si prende cura del bisogno di suo fratello, Allah si prenderà cura del suo bisogno.", "Sahih al-Bukhari n. 2442 · Sahih Muslim n. 2580", "الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ"], ["Nessuno di voi crede [pienamente] finché non desidera per suo fratello ciò che desidera per se stesso.", "Sahih al-Bukhari n. 13 · Sahih Muslim n. 45", "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ"], ["Chi solleva un credente da una difficoltà di questo mondo, Allah lo solleverà da una difficoltà nel Giorno della Resurrezione.", "Sahih Muslim n. 2699", "مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَ ["Onde ficam os dados","Numa base de dados Supabase alojada na Europa. A página está alojada no GitHub Pages. Os donativos passam pelo PayPal, independente do MRE Connect."],
["Os seus direitos","Pode alterar o perfil, mudar o que partilha ou apagar tudo a qualquer momento em «O meu perfil». O botão «Eliminar o meu perfil e os meus dados» apaga o perfil, telefone, e-mail, voto e conta. Para qualquer pedido, escreva para o contacto abaixo."],
["Denúncias e prudência","Os perfis não são verificados. Pode denunciar um perfil suspeito a partir da sua ficha; analisamos as denúncias e podemos remover um perfil. Nunca envie dinheiro a quem não conhece nem partilhe documentos pessoais."],
["Segurança e incidentes","Os contactos ficam numa tabela privada protegida no servidor: esconder um campo na aplicação não chega, ele está realmente inacessível sem autorização. Em caso de fuga de dados, os membros afetados seriam informados rapidamente."],
["Cookies e rastreio","A aplicação não tem publicidade nem ferramentas de rastreio. Guarda apenas no navegador o seu idioma e a sessão de ligação."]]},

del:"Elimina il mio profilo e i miei dati",
priv:[["Cosa raccogliamo","Quello che inserisci nel profilo: nome, cognome, telefono, e-mail (facoltativa), paese, città, settore, profilo business, attività, cosa cerchi e competenze. Viene salvato anche il tuo voto al sondaggio. Se accedi via e-mail, quell'indirizzo è associato al tuo account."],
["Chi vede cosa","Nome, cognome, città, paese, settore e dati professionali sono visibili nell'elenco a chiunque apra l'app. Telefono ed e-mail sono visibili solo se spunti la casella di condivisione, e solo ai membri collegati via e-mail, con un limite di 40 contatti al giorno per membro. Queste consultazioni sono registrate per 90 giorni per individuare abusi."],
["Perché","Solo per permettere agli MRE di trovarsi e contattarsi. Nessuna pubblicità, nessuna vendita di dati."],
["Dove sono i dati","In un database Supabase ospitato in Europa. La pagina è ospitata su GitHub Pages. Le donazioni passano da PayPal, indipendente da MRE Connect."],
["I tuoi diritti","Puoi modificare il profilo, cambiare ciò che condividi o cancellare tutto in qualsiasi momento da «Il mio profilo». Il pulsante «Elimina il mio profilo e i miei dati» cancella profilo, telefono, e-mail, voto e account. Per qualsiasi richiesta scrivi al contatto qui sotto."],
["Segnalazioni e prudenza","I profili non sono verificati. Puoi segnalare un profilo sospetto dalla sua scheda; esaminiamo le segnalazioni e possiamo rimuovere un profilo. Non inviare mai denaro a chi non conosci e non condividere documenti personali."],
["Sicurezza e incidenti","I contatti sono in una tabella privata protetta sul server: nascondere un campo nell'app non basta, è davvero inaccessibile senza autorizzazione. In caso di fuga di dati, i membri interessati sarebbero avvisati rapidamente."],
["Cookie e tracciamento","L'app non ha pubblicità né strumenti di tracciamento. Conserva solo nel browser la lingua e la sessione di accesso."]]},
nl:{consent:"Ik ga ermee akkoord dat mijn voornaam, achternaam, stad en beroepsgegevens zichtbaar zijn voor gebruikers van de app. Mijn telefoon en e-mail zijn alleen zichtbaar volgens mijn keuzes hieronder.",

del:"Mijn profiel en gegevens verwijderen",
priv:[["Wat we verzamelen","Wat je in je profiel invult: voornaam, achternaam, telefoon, e-mail (optioneel), land, stad, sector, bedrijfsprofiel, activiteit, wat je zoekt en vaardigheden. Je stem in de peiling wordt ook bewaard. Log je in met e-mail, dan hoort dat adres bij je account."],
["Wie wat ziet","Voornaam, achternaam, stad, land, sector en beroepsgegevens zijn in de gids zichtbaar voor iedereen die de app opent. Je telefoon en e-mail zijn alleen zichtbaar als je het deelvakje aanvinkt, en alleen voor leden die met e-mail zijn ingelogd, met een limiet van 40 contacten per dag per lid. Deze inzages worden 90 dagen bewaard om misbruik op te sporen."],
["Waarom","Alleen zodat MRE elkaar kunnen vinden en contacteren. Geen reclame, geen verkoop van gegevens."],
["Waar de gegevens staan","In een Supabase-database in Europa. De app-pagina staat op GitHub Pages. Giften lopen via PayPal, dat los staat van MRE Connect."],
["Jouw rechten","Je kunt je profiel wijzigen, aanpassen wat je deelt of alles verwijderen via ‘Mijn profiel’. De knop ‘Mijn profiel en gegevens verwijderen’ wist je profiel, telefoon, e-mail, stem en account. Voor elke vraag schrijf je naar het contactadres hieronder."],
["Meldingen en voorzichtigheid","Profielen worden niet geverifieerd. Je kunt een verdacht profiel melden via zijn pagina; we bekijken meldingen en kunnen een profiel verwijderen. Stuur nooit geld naar iemand die je niet kent en deel geen persoonlijke documenten."],
["Beveiliging en incidenten","Contacten staan in een privétabel die op de server beveiligd is: een veld verbergen in de app is niet genoeg, het is echt ontoegankelijk zonder toestemming. Bij een datalek worden de betrokken leden snel verwittigd."],
["Cookies en tracking","De app heeft geen reclame of trackingtools. Ze bewaart alleen je taal en je inlogsessie in je browser."]]},

del:"Mein Profil und meine Daten löschen",
priv:[["Was wir erfassen","Was du im Profil angibst: Vorname, Nachname, Telefon, E-Mail (optional), Land, Stadt, Branche, Business-Profil, Tätigkeit, Suche und Kompetenzen. Auch deine Stimme in der Umfrage wird gespeichert. Meldest du dich per E-Mail an, wird diese Adresse deinem Konto zugeordnet."],
["Wer was sieht","Vorname, Nachname, Stadt, Land, Branche und berufliche Angaben sind im Verzeichnis für jeden sichtbar, der die App öffnet. Telefon und E-Mail sind nur sichtbar, wenn du das Freigabe-Kästchen ankreuzt, und nur für per E-Mail angemeldete Mitglieder, mit einem Limit von 40 Kontakten pro Tag und Mitglied. Diese Abrufe werden 90 Tage protokolliert, um Missbrauch zu erkennen."],
["Warum","Nur damit sich MRE finden und kontaktieren können. Keine Werbung, kein Datenverkauf."],
["Wo die Daten liegen","In einer Supabase-Datenbank in Europa. Die App-Seite liegt auf GitHub Pages. Spenden laufen über PayPal, unabhängig von MRE Connect."],
["Deine Rechte","Du kannst dein Profil ändern, die Freigaben anpassen oder alles löschen, jederzeit unter „Mein Profil“. Die Schaltfläche „Mein Profil und meine Daten löschen“ entfernt Profil, Telefon, E-Mail, Stimme und Konto. Für Anfragen schreibe an die Kontaktadresse unten."],
["Meldungen und Vorsicht","Profile werden nicht geprüft. Du kannst ein verdächtiges Profil auf seiner Seite melden; wir prüfen Meldungen und können ein Profil entfernen. Sende nie Geld an Unbekannte und gib keine persönlichen Dokumente weiter."],
["Sicherheit und Vorfälle","Kontakte liegen in einer privaten Tabelle, die serverseitig geschützt ist: Ein Feld in der App zu verbergen genügt nicht, es ist ohne Berechtigung wirklich unzugänglich. Bei einem Datenleck würden betroffene Mitglieder zügig informiert."],
["Cookies und Tracking","Die App hat keine Werbung und keine Tracking-Tools. Sie speichert nur deine Sprache und deine Anmeldesitzung im Browser."]]},

priv:[["ما الذي نجمعه","ما تدخله في ملفك: الاسم الشخصي والعائلي والهاتف والبريد الإلكتروني (اختياري) والبلد والمدينة والقطاع والملف المهني والنشاط وما تبحث عنه والمهارات. كما يُسجَّل تصويتك في الاستطلاع. وإذا سجلت الدخول بالبريد الإلكتروني فإن هذا العنوان يرتبط بحسابك."],
["من يرى ماذا","الاسم الشخصي والعائلي والمدينة والبلد والقطاع والمعلومات المهنية ظاهرة في الدليل لكل من يفتح التطبيق. أما هاتفك وبريدك الإلكتروني فلا يظهران إلا إذا وضعت علامة المشاركة، ولا يراهما إلا الأعضاء المتصلون بالبريد الإلكتروني، بحد أقصى 40 جهة اتصال في اليوم لكل عضو. تُسجَّل هذه الاطلاعات لمدة 90 يومًا لكشف إساءة الاستخدام."],
["لماذا","فقط لتمكين مغاربة العالم من إيجاد بعضهم والتواصل. لا إعلانات ولا بيع للبيانات."],
["أين تُخزَّن البيانات","في قاعدة بيانات Supabase مستضافة في أوروبا. وصفحة التطبيق مستضافة على GitHub Pages. أما التبرعات فتمر عبر PayPal المستقل عن MRE Connect."],
["حقوقك","يمكنك تعديل ملفك أو تغيير ما تشاركه أو حذف كل شيء في أي وقت من «ملفي». زر «حذف ملفي وبياناتي» يمحو ملفك وهاتفك وبريدك وتصويتك وحسابك. لأي طلب راسلنا على عنوان التواصل أدناه."],
["البلاغات والحذر","الملفات غير موثَّقة. يمكنك الإبلاغ عن ملف مشبوه من صفحته؛ نراجع البلاغات ويمكننا إزالة ملف. لا ترسل مالًا لشخص لا تعرفه ولا تشارك وثائق شخصية."],
["الأمان والحوادث","تُحفظ وسائل التواصل في جدول خاص محمي على الخادم: إخفاء حقل في التطبيق لا يكفي، فهو غير قابل للوصول فعليًا دون إذن. وفي حال حدوث تسريب للبيانات سيُبلَّغ الأعضاء المعنيون بسرعة."],
["ملفات الارتباط والتتبع","لا يحتوي التطبيق على إعلانات ولا أدوات تتبع. يحتفظ فقط في متصفحك بلغتك وجلسة الدخول."]]}

var news=[],newsOK=false;
function newsHost(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}}
function newsSrc(u){var h=newsHost(u);if(/tiktok\./.test(h))return "TikTok";if(/youtube\.|youtu\.be/.test(h))return "YouTube";if(/facebook\.|fb\.com|fb\.watch/.test(h))return "Facebook";if(/instagram\./.test(h))return "Instagram";return h||"Web"}
function newsDate(x){try{return new Date(x).toLocaleDateString(LOC[lang]||lang,{day:"numeric",month:"long",year:"numeric"})}catch(e){return ""}}
function newsFresh(n){return n&&(Date.now()-Date.parse(n.created_at))<30*864e5}
function newsOkUrl(u){return /^https:\/\/[^\s]+\.[^\s]+$/i.test(u)&&u.length<=500}
function newsCard(){
  var n=news[0],fresh=n&&newsFresh(n);

   +'<div class="nm"><span class="nsrc">'+esc(newsSrc(n.url))+' · '+esc(newsDate(n.created_at))+'</span></div>'
   +'<div class="nlinks"><a class="cta" target="_blank" rel="noopener noreferrer nofollow" href="'+esc(n.url)+'">'+esc(t("nwSee"))+ic("arrow",16)+'</a>'
   +(news.length>1||isMod?'<button class="ghost" data-go="news">'+esc(isMod?t("nwManage"):t("nwAll"))+'</button>':'')+'</div>'
   +'<span class="nwarn">'+esc(t("nwWarn"))+'</span></section>';
}

async function saveNews(f){
  var g=function(n){return String(f.elements[n].value||"").trim()};
  var r={title:g("title"),summary:g("summary")||null,url:g("url")};
  if(r.title.length<3||!newsOkUrl(r.url)){toast(t("nwBad"));return}
  try{await B.newsSave(r);toast(t("nwOk"));render()}catch(e){toast(t("err"))}
}
async function delNews(id){
  if(armed!=="n"+id){armed="n"+id;render();setTimeout(function(){if(armed==="n"+id){armed=false;if(view.p==="news")render()}},4000);return}
  armed=false;
  try{await B.newsDel(id);toast(t("nwGone"));render()}catch(e){toast(t("err"))}
}

  $("aGo").textContent=t("aGo1");$("aX").textContent=t("aX");$("aE").hidden=false;$("aC").hidden=true;$("aCode").value="";

async function authGo(){
  if(!sbc)return;
  var btn=$("aGo");
  if(authFlow!=="code"){
    var em=$("aMail").value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(em)){toast(t("aBad"));return}
    btn.disabled=true;
    try{
      var cur=(await sbc.auth.getUser()).data.user,anon=!!cur&&!cur.email,r,kind;
      if(anon){r=await sbc.auth.updateUser({email:em});kind="email_change";
        if(r.error&&/already|registered|exists/i.test(String(r.error.code||"")+" "+String(r.error.message||""))){
          r=await sbc.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,captchaToken:await tsToken()}});kind="email"}
      }else{r=await sbc.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,captchaToken:await tsToken()}});kind="email"}
      if(r.error)throw r.error;
      authFlow="code";authMail=em;authKind=kind;
      $("aE").hidden=true;$("aC").hidden=false;btn.textContent=t("aGo2");toast(t("aSent"));try{$("aCode").focus()}catch(e){}
    }catch(e){toast(t("aErr"))}
    btn.disabled=false;return;
  }
  var code=$("aCode").value.replace(/\s/g,"");
  if(code.length<4){toast(t("aCodeBad"));return}
  btn.disabled=true;
  try{
    var v=await sbc.auth.verifyOtp({email:authMail,token:code,type:authKind});
    if(v.error)throw v.error;
    try{await sbc.auth.refreshSession()}catch(e){}
    var u=(await sbc.auth.getUser()).data.user;
    if(!u||!u.email)throw new Error("no email");
    uid=u.id;mineId=u.id;hasMail=true;revealed={};
    var id=pend;pend=null;$("auth").hidden=true;
    if(sbReload)await sbReload();
    if(id)doReveal(id);
  }catch(e){toast(t("aCodeBad"))}
  btn.disabled=false;
}

  if(!r.from_city||!r.to_city||!r.depart_date||r.depart_date<todayStr()||(r.return_date&&r.return_date<r.depart_date)){toast(t("rBad"));return}
  if(!f.elements.cons.checked){toast(t("rCReq"));return}
  if(rides.filter(function(x){return x.owner===mineId}).length>=3){toast(t("rMax"));return}
  try{
    if(mode==="shared"&&B&&B.rideSave){r.owner=uid;await B.rideSave(r)}
    else{r.owner=mineId;r.id="l"+Date.now();var a=ridesLocal();a.push(r);store("mre_rides",JSON.stringify(a));rides=a}
    toast(t("rSaved"));stack=[];view={p:"rides"};window.scrollTo(0,0);render();
  }catch(e){toast(String((e&&e.message)||"").indexOf("rides_limit")>=0?t("rMax"):t("err"))}
}
async function delRide(id){
  if(armed!=="d"+id){armed="d"+id;render();setTimeout(function(){if(armed==="d"+id){armed=false;if(view.p==="rides")render()}},4000);return}
  armed=false;
  try{
    if(mode==="shared"&&B&&B.rideDel)await B.rideDel(id);
    else{var a=ridesLocal().filter(function(r){return r.id!==id});store("mre_rides",JSON.stringify(a));rides=a}
    toast(t("rGone"));render();
  }catch(e){toast(t("err"))}
}

var LEG={"fr": {"age": "Je confirme avoir 18 ans ou plus.", "ap": "En continuant, tu confirmes avoir 18 ans ou plus.", "privT": "Confidentialité et mentions légales", "priv": [["Âge minimum", "MRE Connect est réservé aux personnes de 18 ans ou plus. Les mineurs n'ont pas le droit de s'inscrire ni de publier un profil. Si nous constatons qu'un profil appartient à un mineur, nous le supprimons."], ["Responsable et conservation", "Le responsable du traitement des données est l'équipe MRE Connect (contact ci-dessous). Tes données sont conservées tant que ton profil existe et sont supprimées quand tu le supprimes. Si tu penses que tes droits ne sont pas respectés, tu peux saisir la CNIL (cnil.fr) ou l'autorité de protection des données de ton pays."], ["Conditions d'utilisation", "L'application est gratuite. Tu t'engages à donner des informations exactes, à ne publier que des informations qui te concernent et à ne rien publier d'illégal, trompeur ou irrespectueux. Nous pouvons retirer un profil qui ne respecte pas ces règles. MRE Connect met des personnes en relation : les profils ne sont pas vérifiés et nous ne sommes pas partie aux échanges entre membres."], ["Mentions légales", "Éditeur : mreconnect.app, projet non commercial édité par une personne physique à titre non professionnel, dont l'identité a été communiquée à l'hébergeur. Contact : voir ci-dessous. Hébergement de l'application : GitHub Pages (GitHub, Inc., 88 Colin P. Kelly Jr Street, San Francisco, CA 94107, États-Unis). Base de données : Supabase, hébergée en Europe. Nom de domaine : Cloudflare."]]}, "en": {"age": "I confirm that I am 18 or older.", "ap": "By continuing, you confirm that you are 18 or older.", "privT": "Privacy and legal notice", "priv": [["Minimum age", "MRE Connect is for people aged 18 or over. Minors may not sign up or publish a profile. If we find that a profile belongs to a minor, we delete it."], ["Controller and retention", "The data controller is the MRE Connect team (contact belo async function connectSupabase(){

    var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    var lastSig=null;
    var reload=async function(){
      var a=await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(2000);
      if(!a.error)profiles=a.data.map(rowOut);

      if(!rr.error){rides=rr.data;ridesOK=true}else ridesOK=false;

      var sig;try{sig=JSON.stringify([profiles,votes,rides,road,helps,news,isMod,myC,uid,hasMail,Object.keys(revealed).length])}catch(e){sig=null}
      if(sig&&sig===lastSig)return;

    };

         var k=await sb.from("contacts").upsert({id:uid,phone:p.phone,email:p.email||null,share_phone:!!p.shareP,share_email:!!p.shareE,updated_at:new Date().toISOString()});if(k.error)throw k.error;
         try{var bn=String(p.bizno||"").trim().slice(0,40);if(bn){await sb.from("biz_ids").upsert({id:uid,biz_no:bn,updated_at:new Date().toISOString()});myBiz=bn}else{await sb.from("biz_ids").delete().eq("id",uid);myBiz=""}}catch(e){}
         await reload()},
       del:async function(){var r=await sb.rpc("delete_my_account");if(r.error)throw r.error;
         try{await sb.auth.signOut()}catch(e){}
         var n=await sb.auth.signInAnonymously({options:{captchaToken:await tsToken()}});if(n.error)throw n.error;
         uid=n.data.session.user.id;mineId=uid;myC=null;revealed={};hasMail=false;await reload()},

       helpSave:async function(r){var x=await sb.from("help_posts").insert(r);if(x.error)throw x.error;await reload()},
       helpDel:async function(id){var x=await sb.from("help_posts").delete().eq("id",id);if(x.error)throw x.error;await reload()},
       rideDel:async function(id){var x=await sb.from("rides").delete().eq("id",id);if(x.error)throw x.error;await reload()},
       ver:async function(i,v){var r=await sb.rpc("admin_set_verified",{pid:i,v:v});if(r.error)throw r.error;await reload()},
       rm:async function(i){var a=await sb.from("contacts").delete().eq("id",i);var x=await sb.from("profiles").delete().eq("id",i);if(x.error)throw x.error;await reload()}};
